<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>큐티스트릿도 다이어리 · 소스</title><style>body{max-width:1100px;margin:40px auto;padding:0 20px;background:#f7f6ef;color:#293e36;font:16px/1.7 sans-serif}a{color:#285944}select{padding:10px;width:100%;font:inherit;margin:20px 0}pre{background:white;padding:20px;border:1px solid #ddd;overflow:auto;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>큐티스트릿도 다이어리 소스</h1><p>로그인 없이 최종 소스를 확인할 수 있습니다. 전체 JSON에는 이미지와 실행에 필요한 설정 파일도 포함됩니다.</p><a href="/">다이어리로 돌아가기</a> · <a href="files.json" download="cutie-street-source.json">전체 소스 파일 내려받기</a><label><select id="files" aria-label="소스 파일 선택"></select></label><pre id="content">소스를 불러오는 중…</pre><script>fetch('files.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const select=document.getElementById('files'),pre=document.getElementById('content');for(const name of Object.keys(d.files).sort()){const o=document.createElement('option');o.value=name;o.textContent=name;select.append(o)}select.value='app/diary.tsx';const show=()=>{const f=d.files[select.value];pre.textContent=f.encoding==='base64'?'이미지 파일 · 전체 소스 JSON에 base64로 포함되어 있습니다.':f.content};select.addEventListener('change',show);show()}).catch(()=>{document.getElementById('content').textContent='불러오지 못했습니다. 새로고침해 주세요.'});</script></html>
